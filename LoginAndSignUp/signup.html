<html lang="en">
<head>
    <meta charset="UTF-8">

        <link rel="stylesheet" href="../Home/home-style.css">
    <link rel="stylesheet" href="../Home/logout.css">
    <title>Ritterspiele</title>
</head>
<body>
 <header>
        <nav class="navbar">
            <div class="navbar-left">
                <img src="../images/knight.png" alt="knight logo" class="navbar-logo">
                <ul class="navbar-menu">
                    <li><a href="../Home/home.html">Home</a></li>
                    <li><a href="../Spiele/spiele.html">Spiele</a></li>
                    <li><a href="../Impressum/impressum.html">Impressum</a></li>
                    <li><a href="../Kontakt/kontakt.html">Kontakt</a></li>
                    <li><a href="../Profil/profil.html">Profil</a></li>
                </ul>
            </div>

            <div class="navbar-right" id="authButtons">
                <a href="../LoginAndSignUp/login.html" class="btn login-btn">Login</a>
                <a href="../LoginAndSignUp/signup.html" class="btn signup-btn">Sign Up</a>
            </div>

            <div class="navbar-right" id="logoutButton" style="display: none;">
                <button class="btn logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
    </header>
    
    <div class="container">
    <div class="card">
        <h1>Ritterspiele</h1>
        <p class="subtitle">Erstelle dein Konto</p>
        
        <div class="form-group">
            <label>Benutzername</label>
            <input type="text" id="username" placeholder="z.B. Ritter123"/>
        </div>
 
        <div class="form-group">
            <label>E-Mail</label>
            <input type="email" id="email" placeholder="deine@email.com"/>
        </div>
    
        <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="password" placeholder="Mindestens 3 Zeichen"/>
        </div>
 
        <button class="btn-register" id="registerBtn" onclick="register()">Registrieren</button>
 
        <div class="message" id="message"></div>
 
        <p class="login-link">Schon ein Konto? <a href="login.html">Einloggen</a></p>
    </div>
    </div>

    <!-- 1. Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. script.js (Keys + db Client) -->
    <script src="../script.js"></script>

    <!-- 3. signup Logik -->
    <script src="signup.js"></script>
</body>
