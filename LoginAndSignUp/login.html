<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="login.css">
    <title>Ritterspiele</title>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <img src="../images/knight.png" alt="knight logo" class="navbar-logo">
            <ul class="navbar-menu">
                <li><a href="../Home/home.html">Home</a></li>
                <li><a href="#">Spiele</a></li>
                <li><a href="../Impressum/impressum.html">Impressum</a></li>
                <li><a href="../Kontakt/kontakt.html">Kontakt</a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <h1>Login</h1>
        <p class="subtitle">Melde dich an</p>

        <div class="form-group">
            <label>E-Mail</label>
            <input type="email" id="email" placeholder="deine@email.com">
        </div>

        <div class="form-group">
            <label>Passwort</label>
            <input type="password" id="password" placeholder="Passwort">
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">Einloggen</button>

        <div class="message" id="message"></div>

        <p class="signup-link">Noch kein Konto? <a href="signup.html">Registrieren</a></p>
        <p> <a href="reset.html">Passwort vergessen?</a></p>
    </div>

    <!-- 1. Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. script.js (Keys + db Client) -->
    <script src="../script.js"></script>

    <!-- 3. login Logik -->
    <script src="../LoginAndSignUp/login.js"></script>
</body>
</html>
